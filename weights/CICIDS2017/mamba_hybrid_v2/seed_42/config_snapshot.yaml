dataset:
  name: CICIDS2017
  raw_dir: data/raw/CICIDS2017
  processed_dir: data/processed/CICIDS2017_smote3
  label_column: Label
  task: multiclass
  target_binary: false
  drop_columns: []
  max_rows: null
split:
  method: stratified
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
  random_state: 42
preprocess:
  remove_duplicates_before_split: true
  missing_strategy: median
  categorical_strategy: most_frequent
  scaler: standard
  quantile_clip: true
  clip_quantiles:
  - 0.001
  - 0.999
  feature_selection:
    enabled: false
    k_best: 64
  smote:
    enabled: true
    max_per_class: 10000
    k_neighbors: 5
    min_samples_for_smote: 50
    undersample_majority: false
training:
  epochs: 50
  batch_size: 512
  lr: 0.001
  weight_decay: 0.0001
  patience: 10
  gradient_clip_norm: 1.0
  amp: false
  num_workers: 0
  focal_loss: true
  focal_gamma: 2.0
  class_weights: false
  noise_aug_std: 0.05
model:
  d_model: 128
  depth: 4
  dropout: 0.1
  expansion: 2
  d_state: 16
  d_conv: 4
hybrid:
  benign_label: BENIGN
  ae_lambda: 0.1
  warmup_epochs: 5
  decoder_depth: 2
  anomaly_threshold_percentile: 95
  zeroday_holdout_classes:
  - DDoS
  - DoS Hulk
outputs:
  root: outputs_smote
  run_name: mamba_hybrid_v2
